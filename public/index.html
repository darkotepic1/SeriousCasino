<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07110c">
  <title>Spaß-Casino</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎰</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/games2.css">
  <link rel="stylesheet" href="css/games3.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="logo" aria-label="Startseite"><span class="logo-icon">🎰</span><span class="logo-text">Spaß-Casino</span></a>
    <nav class="mainnav" id="mainnav">
      <a href="#/" data-nav="home">Spiele</a>
      <a href="#/stats" data-nav="stats">Statistik</a>
      <a href="#/leaderboard" data-nav="leaderboard">Rangliste</a>
      <a href="#/settings" data-nav="settings">Einstellungen</a>
    </nav>
    <div class="topbar-right">
      <button class="icon-btn" id="soundToggle" title="Sound ein/aus" aria-label="Sound ein/aus">🔊</button>
      <button class="profile-btn" id="profileBtn" title="Profil wechseln"><span class="avatar" id="profileAvatar">?</span><span id="profileName">–</span></button>
      <div class="balance" id="balanceBox" title="Dein Guthaben">
        <span class="chip-icon"></span><span id="balance">0</span>
      </div>
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menü">☰</button>
    </div>
  </header>

  <div class="banner hidden" id="banner"></div>

  <main id="app" class="app"></main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card" id="modalCard"></div></div>
  <div id="toasts" class="toasts"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
