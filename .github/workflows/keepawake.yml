# Hält den kostenlosen Render-Server wach: ruft alle 10 Minuten die Gesundheits-Adresse auf.
# (Render legt Gratis-Server nach 15 Minuten ohne Besucher schlafen.)
# Ausschalten: auf GitHub unter "Actions" → "Server wach halten" → "..." → "Disable workflow".
name: Server wach halten

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Server anpingen
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://seriouscasino.onrender.com/api/health; then echo; echo "Server ist wach."; exit 0; fi
            echo "Versuch $i fehlgeschlagen – warte kurz …"; sleep 20
          done
          echo "Server antwortet nicht (vielleicht gerade beim Neustart)."
